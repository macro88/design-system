packages:
  - "packages/*"
  - "packages/themes/*"
  - "apps/*"
allowBuilds:
  esbuild: true
# Pinned releases inside the default release-age window.
minimumReleaseAgeExclude:
  - "@storybook/addon-a11y@10.6.8"
  - "@storybook/addon-docs@10.6.8"
  - "@storybook/builder-vite@10.6.8"
  - "@storybook/react-dom-shim@10.6.8"
  - "@storybook/react-vite@10.6.8"
  - "@storybook/react@10.6.8"
  - eslint-plugin-storybook@10.6.8
  - storybook@10.6.8

overrides:
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": "14.0.6"
  "eslint-plugin-storybook>@typescript-eslint/types": "8.73.0"
  "eslint-plugin-storybook>@typescript-eslint/utils": "8.73.0"
