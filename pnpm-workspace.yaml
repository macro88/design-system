packages:
  - "packages/*"
  - "packages/themes/*"
  - "apps/*"
allowBuilds:
  esbuild: true
# Pinned releases inside the default release-age window.
minimumReleaseAgeExclude:
  - "@storybook/addon-a11y@10.6.7"
  - "@storybook/addon-docs@10.6.7"
  - "@storybook/builder-vite@10.6.7"
  - "@storybook/react-dom-shim@10.6.7"
  - "@storybook/react-vite@10.6.7"
  - "@storybook/react@10.6.7"
  - eslint-plugin-storybook@10.6.7
  - storybook@10.6.7
  - framer-motion@14.12.0
  - motion-dom@14.12.0
  - motion@14.12.0
